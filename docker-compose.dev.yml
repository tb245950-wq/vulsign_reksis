
services:
  website:
    build:
      target: deps
    working_dir: /app
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/website:/app
      - website_node_modules:/app/node_modules
    init: true

  portal:
    build:
      target: deps
    working_dir: /app
    command: npm run dev -- --hostname 0.0.0.0 --port 3001
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/portal:/app
      - portal_node_modules:/app/node_modules
    init: true

  api:
    environment:
      APP_ENV: development

  ml-service:
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    volumes:
      - ./apps/ml-service/app:/app/app
      - ml_models:/app/models
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    environment:
      APP_ENV: development
      ASSESSMENT_ENABLED: "false"

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  website_node_modules:
  portal_node_modules:
